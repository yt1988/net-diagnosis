<!doctype html>
<html lang="{{lang}}" data-paths="{{pathsAttr}}"{{rootAttr}}>
<head>
<meta charset="utf-8">
<script>{{prepaint}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{head}}
<link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/{{css}}">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="{{homeHref}}" aria-current="page">
      <span class="logo"><img class="logo-light" src="/assets/logo-light.svg" width="90" height="36" alt="{{a:a_logo}}" loading="lazy"><img class="logo-dark" src="/assets/logo-dark.svg" width="90" height="36" alt="{{a:a_logo}}" loading="lazy"></span>
      <span class="brand-name" data-i="app_name"></span>
    </a>
    <div class="top-acts">
      <label class="sel"><span class="sr" data-i="lang_label"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2 2.8 4 2.8 6.5S10 12.5 8 14.5C6 12.5 5.2 10.5 5.2 8S6 3.5 8 1.5z"/></svg>
        <select id="lang">{{langOpts}}</select>
      </label>
      <button class="icon-btn" id="helpBtn" type="button" aria-haspopup="dialog" aria-controls="help"><span class="sr" data-i="faq_h"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.8.6-.8 1.1v.4M8 11.3v.1"/></svg>
      </button>
      <a class="icon-btn gh" href="https://github.com/yt1988/net-diagnosis" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg></a>
      <button class="icon-btn" id="theme" type="button" aria-label="{{a:a_theme}}">
        <svg class="i-sys" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg>
        <svg class="i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>
        <svg class="i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero card">
      <div class="hero-top">
        <div class="hero-h">
          <h1>{{h1}}</h1>
          <p class="lead" data-i="lead"></p>
        </div>
        <!-- the one action: Start / Stop, with the run's time and progress in the button itself -->
        <div class="ctl">
          <button class="go" id="go" type="button"><span class="go-t" id="goT" data-i="start"></span><span class="go-n" id="goN"></span></button>
          <div class="ctl-opts">
            <label class="tog" data-tip="{{a:monitor_tip}}"><input type="checkbox" id="mon"><span class="sw" aria-hidden="true"></span><span data-i="monitor"></span></label>
            <label class="tog ntf" data-tip="{{a:notify_tip}}"><input type="checkbox" id="ntf"><span class="sw" aria-hidden="true"></span><span data-i="notify"></span></label>
          </div>
        </div>
      </div>

      <!-- the verdict: one sentence, how sure and where it exits, 3 numbers, up to 4 pieces of evidence, what it means
           for calls, games and pages, and what to try. Every part keeps its space, so nothing moves when it fills. -->
      <div class="verdict" id="verdict" data-lv="idle" aria-live="polite">
        <p class="v-h" id="vH" data-i="v_idle"></p>
        <p class="v-sub"><span id="vState">&nbsp;</span><span class="v-exit" id="vExit"></span></p>
        <ul class="nums">
          <li data-c="near"><span data-i="k_near"></span><b>–</b></li>
          <li data-c="jitter"><span data-i="k_jitter"></span><b>–</b></li>
          <li data-c="udp"><span data-i="k_udp"></span><b>–</b></li>
        </ul>
        <ul class="ev" id="ev"></ul>
        <ul class="fit">
          <li data-s="call"><span class="fit-k" data-tip="{{a:tip_call}}" tabindex="0" data-i="sc_call"></span><b>–</b><em>&nbsp;</em></li>
          <li data-s="game"><span class="fit-k" data-tip="{{a:tip_game}}" tabindex="0" data-i="sc_game"></span><b>–</b><em>&nbsp;</em></li>
          <li data-s="page"><span class="fit-k" data-tip="{{a:tip_page}}" tabindex="0" data-i="sc_page"></span><b>–</b><em>&nbsp;</em></li>
        </ul>
        <div class="sug" id="sug" data-on=""><p class="sug-h" data-i="sug_h"></p><ul id="sugL"></ul></div>
      </div>
    </section>

    <!-- every part of the path, one lane each: its state now and the last 6 minutes in 5-second windows -->
    <section class="card lanes-c">
      <div class="sec-h">
        <h2 data-i="lanes_h"></h2>
        <ul class="legend" aria-hidden="true">
          <li data-st="ok"><i></i><span data-i="st_ok"></span></li>
          <li data-st="warn"><i></i><span data-i="st_warn"></span></li>
          <li data-st="bad"><i></i><span data-i="st_bad"></span></li>
          <li data-st="gap"><i></i><span data-i="st_gap"></span></li>
        </ul>
      </div>
      <ul class="lanes">{{lanes}}</ul>
      <div class="lanes-f">
        <span class="svc-sum"><span class="m" data-i="svc_h"></span><span id="svcSum"></span></span>
        <button class="lnk" id="svcBtn" type="button" aria-haspopup="dialog" aria-controls="svcs" data-i="svc_edit"></button>
      </div>
    </section>

    <section class="card inc-c" id="incC" hidden>
      <h2 data-i="inc_h"></h2>
      <ol class="inc" id="inc"></ol>
    </section>

    <div data-ms-more></div>
  </main>
</div>

<div class="scrim" id="svcs" hidden>
  <div class="dialog svcs" role="dialog" aria-modal="true" aria-labelledby="svcsT">
    <div class="dlg-h"><h2 id="svcsT" data-i="svc_h"></h2>
      <button class="icon-btn" data-close type="button" aria-label="{{a:a_close}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="dlg-b">
      <div class="chips" id="svcList"></div>
      <form class="svc-add" id="svcForm" autocomplete="off">
        <input id="svcIn" type="text" inputmode="url" placeholder="{{a:svc_add_ph}}" aria-label="{{a:svc_add_ph}}" spellcheck="false">
        <button class="btn" type="submit" data-i="svc_add"></button>
      </form>
      <p class="err" id="svcErr" aria-live="polite"></p>
      <p class="note" data-i="svc_note"></p>
    </div>
  </div>
</div>
<div class="scrim" id="help" hidden>
  <div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="helpT">
    <div class="dlg-h"><h2 id="helpT" data-i="faq_h"></h2>
      <button class="icon-btn" data-close type="button" aria-label="{{a:a_close}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="help-b">
      <nav class="help-nav" id="helpNav" role="tablist">{{helpNav}}</nav>
      <div class="help-pick">
        <button class="icon-btn" type="button" data-hstep="-1" aria-label="{{a:a_prev}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg></button>
        <select id="helpSel" aria-labelledby="helpT"></select>
        <button class="icon-btn" type="button" data-hstep="1" aria-label="{{a:a_next}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg></button>
      </div>
      <div class="help-c" id="helpC">{{helpC}}</div>
    </div>
  </div>
</div>

<script type="application/json" id="data">{{data}}</script>
<script src="/assets/{{strings}}"></script>
<script src="/assets/{{js}}"></script>
</body>
</html>
